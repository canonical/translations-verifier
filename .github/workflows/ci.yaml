name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Install development tools
        run: python -m pip install uv
      - name: Check lockfile
        run: uv lock --check
      - name: Test
        env:
          WLREVISER_BOT_INSTALL_TEST: '1'
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: |
          uv run pyright
          uv run pyright actions/wlreviser-bot/runner.py
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" \
            -ignore '^unexpected key "queue" for "concurrency" section\.' \
            -ignore '^specifying action "\$/actions/wlreviser-bot" in invalid format because ref is missing\.' \
            .github/workflows/ci.yaml \
            .github/workflows/release-please.yaml \
            .github/workflows/wlreviser-bot.yaml \
            examples/github-actions/wlreviser-bot.yaml
      - name: Validate release configuration
        run: >-
          uv run --with check-jsonschema check-jsonschema
          --schemafile https://raw.githubusercontent.com/googleapis/release-please/main/schemas/config.json
          release-please-config.json
      - name: Validate composite action metadata
        run: >-
          uv run --with check-jsonschema check-jsonschema
          --schemafile https://json.schemastore.org/github-action.json
          actions/wlreviser-bot/action.yml