weblate:
  api_url: https://hosted.weblate.org/api/
  project: ubuntu-desktop-translations

github:
  repository: canonical/ubuntu-pro-for-wsl

ai:
  api_url: https://openrouter.ai/api/v1
  model: google/gemini-3.8-flash

components:
  - weblate_component: ubuntu-pro-for-wsl
    source_locale: en
    context_locales: [de, fr, es]
    format: arb
    source_file: gui/packages/ubuntupro/lib/l10n/app_en.arb
    path: gui/packages/ubuntupro/lib/l10n/app_{locale}.arb
    push_after_commit: false