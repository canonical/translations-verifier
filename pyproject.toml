[project]
name = "translations-verifier"
version = "0.1.0"
description = "Advisory verification of ARB translation changes"
readme = "README.md"
authors = [
    { name = "Sergo Beruashvili", email = "sergo.beruashvili@canonical.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<1",
    "pydantic>=2.11,<3",
    "pyicumessageformat>=1,<2",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
translations-verifier = "translations_verifier.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "respx>=0.22,<1",
    "ruff>=0.11,<1",
    "types-pyyaml>=6.0.12,<7",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["translations_verifier"]
